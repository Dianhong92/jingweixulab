<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Jingwei Xu lab,jingwei,jingweixu,jingweixu lab,许靖蔚,许靖蔚实验室,西湖大学许靖蔚实验室网站">
    <base href="./">

    <link rel="stylesheet" href="CSS/banner.css">
    <link rel="stylesheet" href="CSS/all_file.css">
    
    <meta name="google-site-verification" content="u95ALZ0h_2PWVmvZO2-KlLH6rI5ryNDLrRR6ZY0XZgs" />    

    <style>
    /* Header Container */
    #header {
        position: relative;
        width: 100%;
        z-index: 9999;
    }

    .head-nav {
        display: flex;
        flex-direction: column;  
        width: 100%;
        position: relative;
    }
    
    /* Main Content Container */
    #article {
        position: relative;
        z-index: 2;
        background-color: rgb(244, 242, 242);
        width: 100%;
    }

    .display-image {
        margin-top: 0;
        margin-left: 80px;
        margin-right: 80px;
        justify-content: center;
    }

    .content-body {
        margin-left: 80px;
        margin-right: 80px;
        padding-top: 0px;
    }

    @media (max-width: 600px) {
        .display-image,
        .content-body {
            margin-left: 0;
            margin-right: 0;
        }
    }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header id="header">
        <div class="head-nav">
            <div id="nav-placeholder" class="head-nav-2"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <article id="article">
        <div id="header-placeholder" class="display-image"></div>
        <div id="content" class="content-body"></div>
    </article>

    <!-- Footer -->
    <footer id="footer-placeholder"></footer>

    <script>
    function showSidebar() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) sidebar.style.display = 'flex';
    }

    function hideSidebar() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) sidebar.style.display = 'none';
    }

    // 1. Fetch Navigation
    fetch('head_nav_footer/nav.html')
        .then(res => res.text())
        .then(navHtml => {
            document.getElementById('nav-placeholder').innerHTML = navHtml;
            setupNavButtons(); 
        });

    // 2. Fetch Footer
    fetch('head_nav_footer/footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });

    function setupNavButtons() {
        const buttons = document.querySelectorAll('nav button');
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const page = button.getAttribute('data-page');
                if (page) {
                    loadPageContent(page);
                }
            });
        });
    }

    function loadPageContent(pageUrl) {
        fetch(pageUrl)
            .then(response => response.text())
            .then(data => {
                document.getElementById('content').innerHTML = data;

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = data;
                const newTitleTag = tempDiv.querySelector('title');
                
                document.title = newTitleTag ? newTitleTag.textContent : 'Jingwei Xu Lab';

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            })
            .catch(error => console.error('Error loading content:', error));
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadPageContent('Pages/home.html');
    });
    </script>

</body>
</html>
